name: jeevamitra
description: Rural Geo-Spatial Livestock and Agricultural Ecosystem Platform - జీవమిత్ర
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8
  firebase_remote_config: ^5.1.3

  # State Management — manual Riverpod (no codegen in Module 1)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Maps & Geo
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Offline / Cache
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.4

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  table_calendar: ^3.1.2

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  just_audio: ^0.9.40

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.1

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Utils
  timeago: ^3.6.1
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.2
  equatable: ^2.0.5
  uuid: ^4.5.0
  app_links: ^6.3.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1
  network_image_mock: ^2.1.1
  geolocator_platform_interface: ^4.2.6
  plugin_platform_interface: ^2.1.8
  # Codegen added in Module 2+ when freezed models & Hive adapters are needed
  # build_runner: ^2.4.12
  # riverpod_generator: ^2.4.3
  # freezed: ^2.5.7
  # freezed_annotation: ^2.4.4
  # hive_generator: ^2.0.1
  # json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
